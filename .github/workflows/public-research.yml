name: Public data research
on:
  workflow_dispatch:
  push:
    branches: [codex/evidence-backtest]
    paths:
      - .github/workflows/public-research.yml
      - run_public.py
      - research.py
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-research-report
          path: reports/
          if-no-files-found: error
